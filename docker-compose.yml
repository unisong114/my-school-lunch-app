services:
  backend:
    build:
      context: ./backend
    image: school-lunch-backend
    environment:
      # NEIS API 키는 .env 파일 또는 셸 환경 변수로 주입합니다.
      NEIS_API_KEY: ${NEIS_API_KEY:-}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
    expose:
      - "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    image: school-lunch-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

  mcp:
    build:
      context: ./src/mcp
    image: school-lunch-mcp
    environment:
      # NEIS API 키는 .env 파일 또는 셸 환경 변수로 주입합니다. 백엔드와는 별개로
      # 이 서비스가 NEIS API를 직접 호출합니다.
      NEIS_API_KEY: ${NEIS_API_KEY:-}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8100
    expose:
      - "8100"
    ports:
      - "8100:8100"

  agent:
    build:
      context: ./agent
    image: school-lunch-agent
    depends_on:
      - mcp
    environment:
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://mcp:8100/mcp}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
    expose:
      - "9100"
    ports:
      - "9100:9100"

